<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0077b6;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:400px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px lightgray;
}

h2{
    color:#0077b6;
    text-align:center;
    margin-bottom:15px;
}

p{
    text-align:center;
    color:#555;
    margin-bottom:20px;
    line-height:1.6;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:8px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#0077b6;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#023e8a;
}

.links{
    text-align:center;
    margin-top:20px;
}

.links a{
    text-decoration:none;
    color:#0077b6;
}

footer{
    background:#0077b6;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:60px;
}
</style>

</head>

<body>

<header>
<h1>Learning Management System</h1>
</header>

<div class="container">

<h2>Forgot Password</h2>

<p>
Enter your registered email address. A password reset link will be sent to your email.
</p>

<form action="reset-password.html">

<label>Email Address</label>

<input type="email" placeholder="Enter your registered email" required>

<button type="submit">Send Reset Link</button>

</form>

<div class="links">

<p><a href="login.html">Back to Login</a></p>

</div>

</div>

<footer>

<p>&copy; 2026 Learning Management System | All Rights Reserved</p>

</footer>

</body>
</html>
